name: shellcheck
on:
  push:
    paths:
      - "**.sh"
      - "fix-eth-name.initd"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - "fix-eth-name.initd"
      - ".github/workflows/shellcheck.yml"
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck reinstall.sh
          shellcheck trans.sh
          shellcheck initrd-network.sh
          shellcheck fix-eth-name.sh
          shellcheck ttys.sh
          shellcheck fix-eth-name.initd
          shellcheck tests/check_undefined_calls.sh
          shellcheck tests/check_part_layout.sh
          shellcheck tests/check_qcow_verify.sh
          shellcheck tests/check_dd_pipeline.sh
          shellcheck tests/check_sync_time.sh
      - name: Check for calls to undefined functions
        run: |
          bash tests/check_undefined_calls.sh \
            reinstall.sh trans.sh initrd-network.sh fix-eth-name.sh \
            ttys.sh fix-eth-name.initd
