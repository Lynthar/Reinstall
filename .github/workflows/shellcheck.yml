name: shellcheck
on:
  push:
    paths:
      - "**.sh"
      - "fix-eth-name.initd"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - "fix-eth-name.initd"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: |
          shellcheck reinstall.sh
          shellcheck trans.sh
          shellcheck initrd-network.sh
          shellcheck fix-eth-name.sh
          shellcheck fix-eth-name.initd
          shellcheck tests/lib.sh
          shellcheck tests/check_undefined_calls.sh
          shellcheck tests/check_cmdline_contract.sh
          shellcheck tests/check_ifupdown_config.sh
          shellcheck tests/check_part_layout.sh
          shellcheck tests/check_qcow_verify.sh
          shellcheck tests/check_debian_sources.sh
          shellcheck tests/check_dd_pipeline.sh
          shellcheck tests/check_sync_time.sh
          shellcheck tests/check_find_xda.sh
          shellcheck tests/check_mirrors.sh
      - name: Check for calls to undefined functions
        run: |
          bash tests/check_undefined_calls.sh \
            reinstall.sh trans.sh initrd-network.sh fix-eth-name.sh \
            fix-eth-name.initd
      - name: Check the stage 1 / stage 2 command-line contract
        run: bash tests/check_cmdline_contract.sh
