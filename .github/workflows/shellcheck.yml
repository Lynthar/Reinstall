name: shellcheck
on:
  push:
    paths:
      - "**.sh"
      - "fix-eth-name.initd"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**.sh"
      - "fix-eth-name.initd"
      - ".shellcheckrc"
      - ".github/workflows/shellcheck.yml"
permissions:
  contents: read
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Run shellcheck
        run: shellcheck reinstall.sh trans.sh initrd-network.sh fix-eth-name.sh fix-eth-name.initd tests/*.sh
      - name: Check for calls to undefined functions
        run: |
          bash tests/check_undefined_calls.sh \
            reinstall.sh trans.sh initrd-network.sh fix-eth-name.sh \
            fix-eth-name.initd
      - name: Check the stage 1 / stage 2 command-line contract
        run: bash tests/check_cmdline_contract.sh
