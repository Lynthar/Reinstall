name: 运行主程序
on:
  workflow_dispatch:
  push:
    paths:
      - "reinstall.sh"
      - "trans.sh"
      - ".github/workflows/run_reinstall.yml"
      - "tests/check_part_layout.sh"
      - "tests/check_qcow_verify.sh"
      - "tests/check_debian_sources.sh"
      - "tests/check_dd_pipeline.sh"
      - "tests/check_dd_image.sh"
      - "tests/check_sync_time.sh"
      - "tests/check_find_xda.sh"
      - "tests/check_ifupdown_config.sh"
      - "tests/check_cloud_init_network.sh"
      - "tests/check_cloud_init_seed.sh"
      - "tests/check_boot_entry.sh"
      - "tests/check_failure_paths.sh"
      - "tests/check_root_password.sh"
      - "tests/check_hostname.sh"
      - "tests/check_os_name.sh"
      - "tests/lib.sh"
  pull_request:
    paths:
      - "reinstall.sh"
      - "trans.sh"
      - ".github/workflows/run_reinstall.yml"
      - "tests/check_part_layout.sh"
      - "tests/check_qcow_verify.sh"
      - "tests/check_debian_sources.sh"
      - "tests/check_dd_pipeline.sh"
      - "tests/check_dd_image.sh"
      - "tests/check_sync_time.sh"
      - "tests/check_find_xda.sh"
      - "tests/check_ifupdown_config.sh"
      - "tests/check_cloud_init_network.sh"
      - "tests/check_cloud_init_seed.sh"
      - "tests/check_boot_entry.sh"
      - "tests/check_failure_paths.sh"
      - "tests/check_root_password.sh"
      - "tests/check_hostname.sh"
      - "tests/check_os_name.sh"
      - "tests/lib.sh"
permissions:
  contents: read
jobs:
  tests:
    name: 分区角色、镜像验签、Debian 源、DD 管道与镜像预检、时间同步、选盘、网络配置、cloud-init 种子、引导项、失败路径、root 密码、主机名与目标版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo apt-get install -y parted dosfstools busybox
      - run: sudo bash tests/check_part_layout.sh
      - run: bash tests/check_qcow_verify.sh
      - run: bash tests/check_debian_sources.sh
      - run: bash tests/check_dd_pipeline.sh
      - run: bash tests/check_dd_image.sh
      - run: bash tests/check_sync_time.sh
      - run: bash tests/check_find_xda.sh
      - run: bash tests/check_ifupdown_config.sh
      - run: bash tests/check_cloud_init_network.sh
      # in Alpine, as in the Live OS: its lsblk reads filesystem types itself, Ubuntu's asks udev
      - run: >-
          docker run --rm --privileged -v "$PWD":/repo:ro alpine:3.24 sh -c
          'apk add -q bash busybox util-linux parted e2fsprogs xfsprogs btrfs-progs lvm2 dosfstools &&
          mount -t devtmpfs devtmpfs /dev && bash /repo/tests/check_cloud_init_seed.sh'
      - run: bash tests/check_boot_entry.sh
      - run: bash tests/check_failure_paths.sh
      - run: bash tests/check_root_password.sh
      - run: bash tests/check_hostname.sh
      - run: bash tests/check_os_name.sh
  run:
    name: 运行主程序
    runs-on: ubuntu-latest
    env:
      # A pull request's github.sha is a synthetic merge commit; pin to the head commit it tests
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: dd
        run: |
          set -o pipefail
          sudo bash reinstall.sh --debug --password 123@@@ --commit "$COMMIT" --cloud-init-network \
            dd --img=https://download.opensuse.org/tumbleweed/appliances/openSUSE-MicroOS.x86_64-SelfInstall.raw.xz |&
            tee /tmp/dd.log
          # the image's partition table was read from its compressed head and compared with the disk
          grep -q "^DD: The image's GPT partitions end at .*; /dev/[a-z0-9]* is " /tmp/dd.log
          # the switch reaches stage 2 on the kernel command line
          sudo grep -q ' extra_cloud_init_network=1' /boot/efi/EFI/reinstall/grub.cfg
          # the Live OS for dd comes from the one constant, not from the alpine target list
          live=$(sed -n 's/^LIVE_ALPINE_VER=//p' reinstall.sh)
          test -n "$live"
          sudo grep -q " modloop=http://dl-cdn.alpinelinux.org/alpine/v$live/" /boot/efi/EFI/reinstall/grub.cfg
      - name: alpine
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit "$COMMIT" alpine
      - name: debian
        # debian/ubuntu are forced to cloud_image mode in reinstall.sh,
        # passing --ci is redundant
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit "$COMMIT" debian
      - name: ubuntu
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit "$COMMIT" --hostname web1.example.com ubuntu
      - name: BootNext points at the entry whose grub.cfg was written
        run: |
          entries=$(sudo efibootmgr)
          next=$(sed -n 's/^BootNext: //p' <<<"$entries")
          test -n "$next"
          grep -q "^Boot$next\* reinstall (ubuntu" <<<"$entries"
          # each run first undid the one before it
          test "$(grep -c ' reinstall (' <<<"$entries")" = 1
          sudo grep -q '^menuentry "reinstall (ubuntu' /boot/efi/EFI/reinstall/grub.cfg
          # --hostname reaches stage 2 on the kernel command line
          sudo grep -q ' extra_hostname=web1.example.com' /boot/efi/EFI/reinstall/grub.cfg
          # the downloads and the unpacked initrd go once the boot entry is written
          test ! -e /reinstall-tmp
      - name: initrd carries the repository files trans.sh uses
        run: |
          mkdir /tmp/initrd
          cd /tmp/initrd
          zcat /reinstall-initrd | sudo cpio -idm --quiet
          # curl --create-dirs makes repo/ 0750 and cpio keeps it; the Live OS reads it as root
          for f in trans.sh initrd-network.sh; do sudo cmp "$f" "$GITHUB_WORKSPACE/$f"; done
          for f in logviewer.html fix-eth-name.sh fix-eth-name.initd fix-eth-name.service keys/ubuntu-cloud.asc; do
            sudo cmp "repo/$f" "$GITHUB_WORKSPACE/$f"
          done
      - name: reset undoes the last run
        run: |
          sudo bash reinstall.sh reset
          entries=$(sudo efibootmgr)
          if grep -e '^BootNext:' -e ' reinstall (' <<<"$entries"; then exit 1; fi
          sudo test ! -e /boot/efi/EFI/reinstall
          test ! -e /reinstall-vmlinuz
          test ! -e /reinstall-initrd
      - name: a run that fails after touching the boot setup undoes itself
        run: |
          # no such commit: trans.sh 404s after the kernel is downloaded and the old entries are gone
          if out=$(sudo bash reinstall.sh --password 123@@@ --commit 0000000000000000000000000000000000000000 alpine 2>&1); then
            exit 1
          fi
          grep -q 'Stage 1 did not finish' <<<"$out"
          entries=$(sudo efibootmgr)
          if grep -e '^BootNext:' -e ' reinstall (' <<<"$entries"; then exit 1; fi
          sudo test ! -e /boot/efi/EFI/reinstall
          test ! -e /reinstall-vmlinuz
          test ! -e /reinstall-initrd
          test ! -e /reinstall-tmp
      - name: a run refused before touching anything leaves nothing behind
        run: |
          # an unknown target is refused after the work directory is made
          if out=$(sudo bash reinstall.sh fedora 2>&1); then exit 1; fi
          grep -q '^Usage: ' <<<"$out"
          test ! -e /reinstall-tmp
