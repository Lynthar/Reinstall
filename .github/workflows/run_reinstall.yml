name: 运行主程序
on:
  workflow_dispatch:
  push:
    paths:
      - "reinstall.sh"
      - "trans.sh"
      - ".github/workflows/run_reinstall.yml"
      - "tests/check_part_layout.sh"
      - "tests/check_qcow_verify.sh"
      - "tests/check_dd_pipeline.sh"
      - "tests/check_sync_time.sh"
      - "tests/check_find_xda.sh"
jobs:
  tests:
    name: 分区角色、镜像验签、DD 管道、时间同步与选盘
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y parted dosfstools busybox
      - run: sudo bash tests/check_part_layout.sh
      - run: bash tests/check_qcow_verify.sh
      - run: bash tests/check_dd_pipeline.sh
      - run: bash tests/check_sync_time.sh
      - run: bash tests/check_find_xda.sh
  run:
    name: 运行主程序
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: dd
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit ${{ github.sha }} dd --img=https://download.opensuse.org/tumbleweed/appliances/openSUSE-MicroOS.x86_64-SelfInstall.raw.xz
      - name: alpine
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit ${{ github.sha }} alpine
      - name: debian
        # debian/ubuntu are forced to cloud_image mode in reinstall.sh,
        # passing --ci is redundant
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit ${{ github.sha }} debian
      - name: ubuntu
        run: sudo bash reinstall.sh --debug --password 123@@@ --commit ${{ github.sha }} ubuntu
